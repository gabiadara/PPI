<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body {
            height: 30%;
            justify-content: space-around;
        }
    </style>
</head>

<body>
    <label for="minimo">Informe o valor mínimo</label>
    <input type="text" id="minimo">

    <label for="maximo">Informe o valor máximo</label>
    <input type="text" id="maximo">

    <button>Sortear</button>
    <p id="resultado"></p>

    <script>
        document.querySelector("button").addEventListener("click", () => {
            
            let max = parseInt(document.querySelector("#maximo").value);
            let min = parseInt(document.querySelector("#minimo").value);
        
            let i = Math.floor(Math.random() * (max - min + 1)) + min;
            document.querySelector("#resultado").innerText = `${i}`;
        })
    </script>
</body>

</html>
