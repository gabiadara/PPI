<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="container-sm vh-100 bg-dark">
    <div class="row d-flex align-items-center justify-content-center ">
        <div class="col d-flex flex-column align-items-center">
            <div id="visor" class="d-flex">
                <div class=" text-light" id="minutos">00</div>
                <div class=" text-light">:</div>
                <div class=" text-light" id="segundos">00</div>
                <div class=" text-light">:</div>
                <div class=" text-light" id="milisegundos">00</div>

            </div>

            <div>
                <button type="button" class="btn btn-light btn-lg" onclick="iniciar()">Iniciar</button>
                <button type="button" class="btn btn-light btn-lg" onclick="pausar()">Pausar</button>
                <button type="button" class="btn btn-light btn-lg" onclick="zerar()">Zerar</button>
            </div>
        </div>
        <div class="vh-100 d-flex col align-items-center">
            <div class="paradas d-flex flex-column text-center bg-light overflow-auto">
                <ol id="divParadas"></ol>
            </div>
        </div>

    </div>
    <script src="js/script.js"></script>
</body>

</html>
