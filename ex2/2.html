<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-secondary text-center">

    <div class="align-items-center container-sm row">
        <div class="col conteudo d-flex flex-column justify-content-center" >

            <div id="display">00:00:00.000</div>
            <div>
                <button id="iniciar" class="btn btn-outline-light btn-lg">Iniciar</button>
                <button id="pausar" class="btn btn-outline-warning btn-lg ms-1">Pausar</button>
                <button id="zerar" class="btn btn-outline-danger btn-lg ms-1">Zerar</button>
            </div>

        </div>

        <div class="col bg-light card conteudo overflow-auto">
            <strong class="card-header">Paradas:</strong>
            <ul id="pausas" class="list-group d-flex align-items-center justify-content-center bg-light"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

</body>

</html>
