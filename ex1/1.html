<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="calculadora p-3">
        <div class="resultado text-end p-3 bg-light rounded">0</div>
        
        <div class="container p-2">
            <div class="row g-1">
                <button class="col btn btn-light">C</button>
                <button class="col btn btn-light">+/-</button>
                <button class="col btn btn-light">%</button>
                <button class="col btn btn-light">/</button>
            </div>
            <div class="row g-1">
                <button class="col btn btn-outline-light">7</button>
                <button class="col btn btn-outline-light">8</button>
                <button class="col btn btn-outline-light">9</button>
                <button class="col btn btn-light">*</button>
            </div>
            <div class="row g-1">
                <button class="col btn btn-outline-light">4</button>
                <button class="col btn btn-outline-light">5</button>
                <button class="col btn btn-outline-light">6</button>
                <button class="col btn btn-light">-</button>
            </div>
            <div class="row g-1">
                <button class="col btn btn-outline-light">1</button>
                <button class="col btn btn-outline-light">2</button>
                <button class="col btn btn-outline-light">3</button>
                <button class="col btn btn-light">+</button>
            </div>
            <div class="row g-1">
                <button class="col-6 btn btn-outline-light">0</button>
                <button class="col btn btn-outline-light">,</button>
                <button class="col btn btn-light">=</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

</body>
</html>
