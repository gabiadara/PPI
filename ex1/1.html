<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="vh-100 d-flex justify-content-center align-items-center">
    <div class="d-flex flex-column calculadora">
        <div id="visor" class="justify-content-end form-control input-group input-group-lg">0</div>
        <div class="d-flex">
            <div class="d-flex flex-column">
                <button type="button" class="btn btn-light">C</button>
                <button type="button" class="btn btn-outline-light">7</button>
                <button type="button" class="btn btn-outline-light">4</button>
                <button type="button" class="btn btn-outline-light">1</button>
                <button type="button" class="btn btn-outline-light">+/-</button>
            </div>
            <div class="d-flex flex-column">
                <button type="button" class="btn btn-light">CE</button>
                <button type="button" class="btn btn-outline-light">8</button>
                <button type="button" class="btn btn-outline-light">5</button>
                <button type="button" class="btn btn-outline-light">2</button>
                <button type="button" class="btn btn-outline-light">0</button>
            </div>
            <div class="d-flex flex-column">
                <button type="button" class="btn btn-light">%</button>
                <button type="button" class="btn btn-outline-light">9</button>
                <button type="button" class="btn btn-outline-light">6</button>
                <button type="button" class="btn btn-outline-light">3</button>
                <button type="button" class="btn btn-outline-light">.</button>
            </div>
            <div class="d-flex flex-column">
                <button type="button" class="btn btn-light">/</button>
                <button type="button" class="btn btn-light">*</button>
                <button type="button" class="btn btn-light">-</button>
                <button type="button" class="btn btn-light">+</button>
                <button type="button" class="btn btn-light">=</button>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
