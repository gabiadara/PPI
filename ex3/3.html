<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="vh-100 bg-black ">
    <div class="d-flex align-items-center">
        <div class="vh-100 w-50 border border-dark">
            <ul class="vh-100 list-group text-white  overflow-auto" id="notasSalvas"></ul>
        </div>
        <div class="d-flex justify-content-center align-items-center flex-column w-50">
            <textarea class="form-control bg-dark text-white" id="nova-nota"></textarea>
            <button id="btn-salvar" type="button" class="w-25 btn btn-outline-light mt-2" onclick="salvarNota()">Salvar Nota</button>
            <button id="btn-salvar-edicao" type="button" class="w-25 btn btn-outline-light mt-2">Salvar Edições</button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
